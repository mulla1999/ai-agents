# Serves the SPA and proxies the API on one origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 6m;  # resume uploads (5 MB limit in the backend)

    location /api/ {
        include /etc/nginx/snippets/security-headers.inc;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # discovery runs and resume generation can take a while
    }

    location = /healthz {
        proxy_pass http://backend:8000;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
