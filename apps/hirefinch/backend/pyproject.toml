[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hirefinch"
version = "0.1.0"
description = "Personal job-search agent: discovers jobs, scores them against a verified profile, tailors the resume and manages supervised applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agents-core",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "itsdangerous>=2.2",
    "cryptography>=42",
    "segno>=1.6",
    "redis>=5",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "reportlab>=4.2",
]

[project.optional-dependencies]
azure = ["agents-core[azure]"]
gemini = ["agents-core[gemini]"]
openai = ["agents-core[openai]"]
all = ["agents-core[all]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
hirefinch = "hirefinch.cli:main"

[tool.uv.sources]
agents-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/hirefinch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = ["live: talks to real external services; run only with HIREFINCH_LIVE_TESTS=1"]
