id: up-old-age-pension
name: Vridhavastha Pension Yojana (Old Age Pension, Uttar Pradesh)
level: state
state: uttar_pradesh
ministry: Social Welfare Department, Government of Uttar Pradesh
tags: [pension, senior-citizen]
summary: Monthly pension for elderly people in Uttar Pradesh from low-income families.
benefits: Rs 1,000 per month, paid every three months directly into the bank account.
eligibility:
  - field: age
    op: gte
    value: 60
    reason: Must be 60 years or older
  - any:
      - {field: is_bpl, op: eq, value: true, reason: Household is on the BPL list}
      - all:
          - {field: residence, op: eq, value: rural, reason: Lives in a village}
          - {field: annual_family_income, op: lte, value: 46080, reason: "Family income up to Rs 46,080 a year"}
        reason: Village family with income up to Rs 46,080 a year
      - all:
          - {field: residence, op: eq, value: urban, reason: Lives in a town or city}
          - {field: annual_family_income, op: lte, value: 56460, reason: "Family income up to Rs 56,460 a year"}
        reason: Town or city family with income up to Rs 56,460 a year
    reason: "Household must be on the BPL list, or family income must be up to Rs 46,080 a year (village) or Rs 56,460 a year (town or city)"
documents:
  - "Age proof: certified copy of the family (kutumb) register, or an educational certificate showing date of birth (Aadhaar is not accepted as age proof since March 2026)"
  - Income certificate from the tehsil, or a copy of the BPL list entry
  - Aadhaar card
  - Bank account passbook (Aadhaar-linked)
  - Passport-size photograph
notes:
  - "The central old age pension share is part of this pension in Uttar Pradesh (Rs 800 state + Rs 200 central, and Rs 500 + Rs 500 from age 80); a person gets one old age pension, not both."
  - People already getting another government pension are not eligible.
how_to_apply: Apply online on the UP social pension portal (SSPY), yourself or through a CSC. Village applications are checked through the block office (BDO) and town applications through the SDM; the district social welfare office handles the scheme.
apply_url: https://sspy-up.gov.in/oap/public_new/UserRegistrationForm.aspx?Scheme=OldAgePension
source_url: https://samajkalyan.up.gov.in/en/article/old-age-pension-scheme
verified_on: 2026-11-20
