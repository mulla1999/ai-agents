id: kanya-sumangala
name: Mukhyamantri Kanya Sumangala Yojana (Uttar Pradesh)
level: state
state: uttar_pradesh
ministry: Women and Child Development Department, Government of Uttar Pradesh
tags: [girl-child, education]
summary: Money paid in stages from a girl's birth to her college admission, for families in Uttar Pradesh.
benefits: Rs 25,000 in total, paid in six stages (birth, full vaccination, class 1, class 6, class 9, and admission to a degree or diploma after class 10 or 12), directly into the bank account.
eligibility:
  - field: gender
    op: eq
    value: female
    reason: For girls only
  - field: age
    op: lte
    value: 21
    reason: Stages run from birth until admission to a degree or diploma course
  - field: annual_family_income
    op: lte
    value: 300000
    reason: Family income must be up to Rs 3 lakh a year
documents:
  - Girl's birth certificate
  - Family photograph with the girl
  - Parent's Aadhaar card
  - Income certificate
  - Residence proof of Uttar Pradesh
  - Bank account passbook (girl's or parent's)
  - Proof for the stage (vaccination card, school admission record, ...)
notes:
  - At most two girls per family (a third is allowed if the second birth is twins).
  - The family must be permanent residents of Uttar Pradesh.
  - The birth stage is for girls born on or after 1 April 2019; older girls apply at the stage they are at now (class 1, 6, 9, or degree/diploma admission). The age limit used here only approximates the stages.
how_to_apply: Apply online on the Kanya Sumangala portal or through a CSC, the block office or the district probation office.
apply_url: https://mksy.up.gov.in
source_url: https://mksy.up.gov.in
verified_on: null
