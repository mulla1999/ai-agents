id: kisan-credit-card
name: Kisan Credit Card (KCC) with Modified Interest Subvention Scheme
level: central
applies_to: household
ministry: Ministry of Agriculture and Farmers Welfare / Department of Financial Services (implemented by banks under RBI directions)
tags: [farmer, credit, loan, fisheries, animal-husbandry]
summary: A revolving bank credit card for farmers, tenant farmers, sharecroppers, fishers and animal husbandry farmers to meet crop and allied-activity costs, with government-subsidised interest on short-term loans.
benefits: "Short-term loans for crops and allied activities (dairy, animal husbandry, fisheries, bee keeping) through a KCC valid for six years. For loans in 2025-26, interest is 7% a year on up to Rs 3 lakh, falling to an effective 4% if repaid on time (3% prompt repayment incentive). Farmers only in animal husbandry, dairy or fisheries get this on up to Rs 2 lakh. No collateral is needed for loans up to Rs 2 lakh. Small and marginal farmers can keep the subsidised rate for up to six more months after harvest on loans against warehouse receipts."
eligibility:
  - field: occupation
    op: in
    value: [farmer, fisher]
    reason: For farmers (owners, tenant farmers, oral lessees and sharecroppers), animal husbandry farmers, fishers and fish farmers
documents:
  - Filled KCC application form
  - Land record, or tenancy certificate or equivalent certificate (one-time documentation)
  - For sharecroppers and oral lessees, a certificate of crop cultivation from the local administration or panchayat
  - Aadhaar (needed for the interest subvention benefit)
notes:
  - Tenant farmers, oral lessees and sharecroppers can get a KCC without owning land; the bank accepts a certificate from the local administration or panchayat, or an affidavit for loans up to Rs 50,000.
  - "Fishers, fish farmers and animal husbandry or dairy farmers can get a KCC for working capital for those activities; the rule here counts fishers and farmers, but cannot tell an animal husbandry farmer who chose another occupation."
  - "The interest rates above are from the RBI circular for loans in 2025-26. The Union Budget 2025-26 announced raising the subsidised KCC loan limit from Rs 3 lakh to Rs 5 lakh, but the latest official circular (13 January 2026) still uses Rs 3 lakh. The continuation and terms for 2026-27 had not been officially notified when this record was checked; confirm with the bank."
  - The 3% prompt repayment benefit is lost if the loan is repaid after one year. Aadhaar seeding and e-KYC are mandatory for the interest subsidy.
  - The amount of the card limit is set by the bank from the local Scale of Finance and the land or units farmed; collateral above Rs 2 lakh is at the bank's discretion.
  - New RBI KCC Directions, 2026 apply to KCC loans sanctioned from 1 January 2027; earlier loans continue under the old rules until renewal.
  - Processing and other charges are as per the bank's policy.
how_to_apply: Apply at any commercial bank, regional rural bank, small finance bank or cooperative bank branch (or a Primary Agricultural Credit Society) with the application form and land or cultivation documents. Many banks also accept applications online.
source_url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=13522&Mode=0
