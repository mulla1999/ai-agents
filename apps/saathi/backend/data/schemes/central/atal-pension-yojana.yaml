id: atal-pension-yojana
name: Atal Pension Yojana (APY)
level: central
ministry: Ministry of Finance (administered by PFRDA)
tags: [pension, unorganised-sector]
summary: A guaranteed monthly pension from age 60 for people who contribute a small amount every month.
benefits: Guaranteed pension of Rs 1,000 to Rs 5,000 per month from age 60, depending on the amount contributed. The pension continues to the spouse, and the saved amount goes to the nominee.
eligibility:
  - field: age
    op: gte
    value: 18
    reason: Must be at least 18 years old to join
  - field: age
    op: lte
    value: 40
    reason: Must join before turning 41
  - field: has_bank_account
    op: eq
    value: true
    reason: Needs a savings bank or post office account
  - field: has_paid_income_tax
    op: eq
    value: false
    reason: People who are or have ever been income tax payers cannot join (since 1 October 2022)
documents:
  - Savings bank or post office account
  - Aadhaar card
  - Mobile number (optional, for account updates)
notes:
  - The contribution depends on the age at joining and the pension chosen, and is auto-debited monthly, quarterly or half-yearly until age 60.
  - Only the applicant's own income-tax status counts. The husband or wife of a taxpayer can join if he or she has never paid income tax.
  - If someone who joined on or after 1 October 2022 is found to have been an income tax payer on or before the date of applying, the account is closed and the savings returned. Becoming a taxpayer after joining does not close the account.
how_to_apply: Fill the APY registration form at the bank branch or post office where you have your savings account, or join online through eAPY or your bank's net banking.
apply_url: https://www.pfrda.org.in/schemes/atal-pension-yojana-apy
source_url: https://www.pfrda.org.in/schemes/atal-pension-yojana-apy
verified_on: 2026-11-20
