id: post-matric-scholarship-st
name: Post-Matric Scholarship for Scheduled Tribe Students
level: central
ministry: Ministry of Tribal Affairs
tags: [scholarship, education, st]
summary: Pays fees and a maintenance allowance for ST students studying in class 11 and above, including college.
benefits: Compulsory fees paid to the institution (up to the limit fixed by the state) plus a maintenance allowance of Rs 230 to Rs 1,200 a month, depending on the course.
eligibility:
  - field: social_category
    op: eq
    value: st
    reason: For Scheduled Tribe students
  - field: is_studying_post_matric
    op: eq
    value: true
    reason: Must be studying in class 11 or above (post-matriculation)
  - field: annual_family_income
    op: lte
    value: 250000
    reason: Family income must be Rs 2.5 lakh per year or less
documents:
  - Tribe certificate (ST)
  - Family income certificate
  - Previous year's marksheet
  - Fee receipt and admission proof / bonafide certificate from the institution
  - Aadhaar card
  - Bank account in the student's name (seeded with Aadhaar)
  - Domicile certificate
  - Passport-size photograph
notes:
  - Not available to students already receiving another scholarship.
  - Apply through the state of domicile.
  - The income limit does not apply to orphans supported by a guardian.
  - The student's bank account must be linked to both Aadhaar and mobile number.
  - Students at the notified Top Class institutes get the separate Top Class scholarship instead of this one.
how_to_apply: Apply online on the National Scholarship Portal or your state's scholarship portal during the application window, then get the application verified by your institution.
apply_url: https://scholarships.gov.in
source_url: https://scholarships.gov.in/public/schemeGuidelines/Post-matric-guidelines-ST.pdf
verified_on: 2026-11-20
