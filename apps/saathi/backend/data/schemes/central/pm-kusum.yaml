    url: https://cdnbbsr.s3waas.gov.in/s3716e1b8c6cd17b771da77391355749f3/uploads/2024/01/20240118413909461.pdf
    quote: "The Central Government will provide financial assistance of 30% (or 50% for North Eastern Region/Hilly region/Islands) of the Benchmark Cost or the Tender Cost, whichever is lower"
