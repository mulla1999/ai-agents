  - claim: In NE States, Sikkim, J&K, HP, Uttarakhand, Lakshadweep and A&N Islands farmer pays at most 20%
    url: https://cdnbbsr.s3waas.gov.in/s3716e1b8c6cd17b771da77391355749f3/uploads/2024/01/20240118413909461.pdf
    quote: "The State Government will give a subsidy of at-least 30%; and the remaining at most 20% will be provided by the farmer."
