id: nmmss
name: National Means-cum-Merit Scholarship Scheme (NMMSS)
level: central
ministry: Ministry of Education (Department of School Education and Literacy)
tags: [scholarship, education, school, merit]
summary: Rs 12,000 a year from class 9 to class 12 for students of government, government-aided and local body schools who pass a state selection test in class 8 and whose family earns Rs 3.5 lakh a year or less.
benefits: "Rs 12,000 a year (Rs 1,000 a month), paid from class 9 and renewed each year up to class 12, for up to four years."
eligibility:
  - all:
      - field: current_class
        op: gte
        value: 8
        reason: The selection test is taken in class 8
      - field: current_class
        op: lte
        value: 12
        reason: The scholarship runs from class 9 to class 12
    reason: Must be in class 8 (to take the selection test) or a scholar in classes 9 to 12
  - field: annual_family_income
    op: lte
    value: 350000
    reason: Parents' income from all sources must be Rs 3.5 lakh per year or less
documents:
  - Parent's or guardian's income certificate issued by the competent authority of the State/UT
  - Caste certificate (if applying in a reserved category)
  - Aadhaar number (seeded with the bank account)
  - Bank account in a scheduled bank with core banking
notes:
  - "Open to students of any community, but only those who pass the NMMSS selection test (Mental Ability Test and Scholastic Aptitude Test) held by the state in class 8. The rules here cannot check the class, marks or test result."
  - "To sit the test you need at least 55% marks (or equivalent grade) in class 7 (50% for SC/ST). The 2026-27 announcement from All India Radio mentions class 8 marks instead; follow your state's NMMSS notice."
  - "You must be a regular student in a Government, Government-aided or local body school. Students of Kendriya Vidyalayas, Jawahar Navodaya Vidyalayas, government residential schools (with free boarding and lodging) and private schools are not eligible."
  - "To keep the scholarship in classes 11 and 12 you need at least 60% marks in class 10 (55% for SC/ST), and you must pass class 9 and class 11 at the first attempt."
  - About 1 lakh new scholarships are given each year, divided among states by quota; states apply their own reservation rules.
  - "For 2026-27, the last date on the National Scholarship Portal was extended to 15 November 2026 (as reported). Check the portal for later extensions."
how_to_apply: Register for your state's NMMSS selection exam through your school in class 8. If selected, apply (and renew each year) on the National Scholarship Portal; the school and then the district verify the application.
apply_url: https://scholarships.gov.in
source_url: https://scholarships.gov.in/public/schemeGuidelines/NMMSSGuidelines.pdf
verified_on: null
