id: e-shram
name: e-Shram registration for unorganised workers
level: central
ministry: Ministry of Labour and Employment
tags: [registration, unorganised-sector, social-security]
summary: A free national registration for unorganised workers. Registered workers get a lifelong 12-digit Universal Account Number (UAN) / e-Shram card and one place to find and join social security schemes.
benefits: A permanent e-Shram card with a 12-digit UAN that never expires and needs no renewal. Registration is free. Through the e-Shram portal workers can find and apply for linked welfare schemes such as PM-SYM pension, PMJJBY and PMSBY insurance, PDS ration, PMAY-G housing, NSAP old-age pension, Ayushman Bharat PM-JAY and PM Kisan Maandhan.
eligibility:
  - field: occupation
    op: in
    value: [unorganised_worker, agricultural_labourer, farmer, artisan, street_vendor, construction_worker, domestic_worker, fisher, self_employed]
    reason: For home-based, self-employed or wage workers in the unorganised sector
  - field: age
    op: gte
    value: 16
    reason: Must be at least 16 years old
documents:
  - Aadhaar number
  - Mobile number linked to Aadhaar
notes:
  - Members of EPFO (provident fund) or ESIC cannot register. Being in NPS alone does not stop registration, so this is not checked automatically.
  - There is no income limit and no upper age limit for registering.
  - Agricultural labourers and landless farmers can register. Gig and platform workers have a separate registration option on the portal.
  - Registering does not by itself pay money; it gives access to the linked schemes, each with its own rules.
  - Helpline 14434 or 1800-889-6811 (9 am to 6 pm, every day).
how_to_apply: Self-register on the e-Shram portal with Aadhaar and the Aadhaar-linked mobile (OTP), or get registered free at the nearest Common Service Centre (CSC). Registered workers should keep their profile and occupation updated.
apply_url: https://register.eshram.gov.in/#/user/self
source_url: https://eshram.gov.in/faqs
