id: nfsa-free-ration
name: Free foodgrains under the National Food Security Act (PM Garib Kalyan Anna Yojana)
level: central
applies_to: household
ministry: Ministry of Consumer Affairs, Food and Public Distribution (Department of Food and Public Distribution)
tags: [food, ration, household, bpl]
summary: Free monthly rice, wheat or coarse grains from the ration shop for families with an Antyodaya (AAY) or Priority Household (PHH) ration card.
benefits: Antyodaya (AAY) families get 35 kg of foodgrains per family per month and Priority Households (PHH) get 5 kg per person per month, free of cost from 1 January 2024 for five years (to the end of 2028) under PM Garib Kalyan Anna Yojana.
eligibility:
  - field: ration_card
    op: in
    value: [aay, phh]
    reason: Family must hold an Antyodaya (AAY) or Priority Household (PHH) ration card under the National Food Security Act
documents:
  - AAY or PHH ration card
  - Aadhaar of family members, for biometric authentication on the ration shop's e-PoS machine
notes:
  - "Families without an NFSA ration card can apply for one to the state food and civil supplies department; each state decides who is a priority household within its fixed quota (up to 75% of the rural and 50% of the urban population), so the rule here cannot tell whether a family without a card would get one."
  - "One Nation One Ration Card: the same ration card works at any ration shop in India, so migrant workers can take their grain where they live now."
  - In Chandigarh, Puducherry and some areas of Dadra and Nagar Haveli and Daman and Diu the benefit is paid as cash into the bank account instead of grain.
  - "A draft National Food Security (Amendment) Bill, 2026 proposes changing the AAY entitlement to 7 kg per person per month, with a maximum of 35 kg per family. It is only a draft (public comments closed on 13 July 2026); the 35 kg per family rule still applies."
  - Pregnant women, breastfeeding mothers and children up to 14 also have separate meal and maternity entitlements under the Act (through Anganwadi and school meal schemes).
how_to_apply: If you have an AAY or PHH ration card, collect your grain at your fair price (ration) shop with Aadhaar authentication. To get a new card, apply to your state's food and civil supplies department, through its ration card portal or a CSC.
apply_url: https://nfsa.gov.in/portal/Ration_Card_State_Portals_AA
