id: pmfby
name: Pradhan Mantri Fasal Bima Yojana (PMFBY)
level: central
applies_to: household
ministry: Ministry of Agriculture and Farmers Welfare
tags: [farmer, insurance, crop-insurance]
summary: Low-cost crop insurance for farmers, including tenant farmers and sharecroppers, against crop loss from drought, flood, pests, hailstorms and other natural risks.
benefits: "The farmer pays at most 2% of the sum insured for Kharif crops, 1.5% for Rabi food grain and oilseed crops, and 5% for commercial and horticultural crops; the Central and State Governments pay the rest of the premium. Covers yield loss of standing crops, prevented sowing (claims up to 25% of the sum insured), losses to cut crops drying in the field for up to 14 days after harvest, and localised calamities on individual farms. Claims are paid directly into the bank account."
eligibility:
  - field: occupation
    op: eq
    value: farmer
    reason: For farmers, including tenant farmers and sharecroppers, who grow notified crops in notified areas
documents:
  - Aadhaar number
  - Land record (Record of Rights / Land Possession Certificate), or for tenant farmers and sharecroppers the tenancy or sharing agreement or other document notified by the State
  - Declaration of the crop sown or intended to be sown (sowing certificate where the State asks for it)
  - Bank account details
notes:
  - "Tenant farmers and sharecroppers are covered even if they do not own the land: they must show the tenancy/sharing agreement or other document the State has notified."
  - Only notified crops in notified areas are covered; each State notifies its crops, areas and enrolment cut-off dates every season. Apply before the cut-off (usually within about two weeks of the start of sowing).
  - "Enrolment is voluntary for all farmers. Farmers with a crop loan or Kisan Credit Card are enrolled by their bank automatically unless they give the bank an opt-out declaration at least 7 days before the season's cut-off date."
  - "The scheme is run by each State. 25 States and UTs implemented it in Kharif 2026; West Bengal rejoined from Kharif 2026 and Bihar from Rabi 2026-27. Check whether your State runs PMFBY."
  - In North-Eastern and Himalayan States the Centre and State share the government part of the premium 90:10; elsewhere 50:50.
  - From Kharif 2026, crop loss from wild animal attack (where the State has notified it) and paddy inundation are covered as localised risks; such losses must be reported within 72 hours through the Crop Insurance App with geotagged photos.
  - Not covered are losses from war, nuclear risks, riots, theft, malicious damage and other preventable risks, and losses already compensated from another source.
  - "Helpline: Krishi Rakshak Portal & Helpline, toll-free 14447."
how_to_apply: Farmers with a crop loan or KCC are enrolled through their bank. Others can enrol on the National Crop Insurance Portal (pmfby.gov.in), at a bank branch, a Primary Agricultural Credit Society, a Common Service Centre or through an insurance company agent, before the State's cut-off date for the season.
