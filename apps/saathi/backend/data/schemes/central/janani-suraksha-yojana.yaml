id: janani-suraksha-yojana
name: Janani Suraksha Yojana (JSY)
level: central
ministry: Ministry of Health and Family Welfare (National Health Mission)
tags: [women, maternity, health]
summary: A cash payment to pregnant women who give birth in a government or accredited private hospital, to encourage safe delivery in a health facility.
benefits: "Cash to the mother after an institutional delivery: in Low Performing States Rs 1,400 in rural areas and Rs 1,000 in urban areas; in other states Rs 700 in rural areas and Rs 600 in urban areas. BPL women who choose to deliver at home get Rs 500 in all states."
eligibility:
  - field: gender
    op: eq
    value: female
    reason: For women only
  - field: is_pregnant
    op: eq
    value: true
    reason: Paid for giving birth, so the woman must be pregnant
  - any:
      - field: state
        op: in
        value:
          - uttar_pradesh
          - uttarakhand
          - bihar
          - jharkhand
          - madhya_pradesh
          - chhattisgarh
          - assam
          - rajasthan
          - odisha
          - jammu_and_kashmir
        reason: Lives in a Low Performing State, where all pregnant women delivering in a government health centre are covered
      - field: social_category
        op: in
        value:
          - sc
          - st
        reason: SC or ST woman
      - field: is_bpl
        op: eq
        value: true
        reason: BPL household
    reason: In a Low Performing State every woman is covered; in other states only BPL, SC or ST women
documents:
  - Mother and Child Protection (MCP) card or JSY card from the ASHA or ANM
  - BPL card or SC/ST certificate (needed outside the Low Performing States, and in all states for delivery in an accredited private hospital or at home)
  - Bank account details for the payment
  - Aadhaar card
notes:
  - There is no age limit and no limit on the number of children (these conditions were removed in May 2013).
  - For delivery in an accredited private hospital, only BPL, SC or ST women are covered, in every state.
  - The home-delivery payment of Rs 500 is only for BPL women.
  - The payment is linked to the delivery. A woman who is only breastfeeding a baby born earlier is not covered by this rule, although the rule here cannot tell the two apart.
  - Ladakh was part of Jammu and Kashmir when the Low Performing States list was made; check with the local health centre whether it is treated as a Low Performing State.
  - Delivery in a public health facility is also free and cashless (including caesarean, drugs, tests, diet and transport) under Janani Shishu Suraksha Karyakram. Women can also get PMMVY maternity benefit.
how_to_apply: Register the pregnancy with the ASHA, ANM or nearest government health centre and get the MCP/JSY card. Deliver in a government or accredited private hospital; the payment is made to the mother after the delivery.
apply_url: null
