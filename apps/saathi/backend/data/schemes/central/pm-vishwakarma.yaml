id: pm-vishwakarma
name: PM Vishwakarma
level: central
ministry: Ministry of Micro, Small and Medium Enterprises
tags: [artisan, skills, loan, msme]
summary: Recognition, training, tools and cheap loans for traditional artisans and craftspeople in 18 trades (carpenters, potters, tailors, blacksmiths, cobblers, and others).
benefits: PM Vishwakarma certificate and ID card, skill training (5-7 days basic, 15 days advanced) with a stipend of Rs 500 per day, a Rs 15,000 toolkit grant, collateral-free loans of Rs 1 lakh (18 months) and then Rs 2 lakh (30 months) at 5% interest, and Re 1 per digital transaction (up to 100 a month).
eligibility:
  - field: occupation
    op: eq
    value: artisan
    reason: Must be a self-employed artisan or craftsperson in one of the 18 listed trades
  - field: age
    op: gte
    value: 18
    reason: Must be at least 18 years old
  - field: is_government_employee
    op: eq
    value: false
    reason: People in government service and their families are excluded
documents:
  - Aadhaar card
  - Mobile number linked to Aadhaar
  - Bank account details
  - Ration card (for family details)
notes:
  - "Only these 18 trades: carpenter, boat maker, armourer, blacksmith, hammer and toolkit maker, locksmith, sculptor / stone breaker, goldsmith, potter, cobbler, mason, basket / mat / broom maker / coir weaver, traditional doll and toy maker, barber, garland maker, washerman, tailor, fishing net maker."
  - Must be working in the trade, self-employed, on the day of registration.
  - Only one member per family (husband, wife and unmarried children).
  - Not eligible if a loan was taken under PMEGP, PM SVANidhi, Mudra or a similar central or state credit scheme in the last 5 years.
  - The scheme's registration target was reached in September 2025; check at the CSC whether new registrations are still being accepted.
how_to_apply: Register through a Common Service Centre (CSC) using Aadhaar biometric verification. The application is then verified by the gram panchayat or urban local body.
apply_url: https://pmvishwakarma.gov.in
source_url: https://pmvishwakarma.gov.in/cdn/MiscFiles/eng_v30.0_PM_Vishwakarma_Guidelines_final.pdf
verified_on: null
