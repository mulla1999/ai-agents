id: pmay-g
name: Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)
level: central
applies_to: household
ministry: Ministry of Rural Development
tags: [housing, rural]
summary: Money to build a pucca house for rural families who are homeless or live in a kutcha or dilapidated house.
benefits: Rs 1.20 lakh in the plains, or Rs 1.30 lakh in hilly states, north-eastern states and difficult areas, paid in instalments as construction progresses, plus help through MGNREGA wages and toilet support.
eligibility:
  - field: residence
    op: eq
    value: rural
    reason: For families in rural areas
  - field: has_pucca_house
    op: eq
    value: false
    reason: Must be homeless or live in a kutcha or dilapidated house
  - field: is_government_employee
    op: eq
    value: false
    reason: Households with a government employee are excluded
  - field: is_income_tax_payer
    op: eq
    value: false
    reason: Households paying income tax are excluded
documents:
  - Aadhaar card
  - Bank or post office account passbook (Aadhaar-linked)
  - MGNREGA job card
notes:
  - Beneficiaries are chosen from the Awaas+ survey and SECC lists (the Permanent Wait List) and verified by the gram sabha; the family must be on the list.
  - "Automatically excluded (list revised in 2024): households with a motorised three- or four-wheeler; mechanised three- or four-wheeler farm equipment; a Kisan Credit Card limit of Rs 50,000 or more; any member who is a government employee; a non-farm enterprise registered with the government; any member earning more than Rs 15,000 a month; anyone paying income tax or professional tax; 2.5 acres or more of irrigated land; or 5 acres or more of unirrigated land. Houses with a pucca roof or pucca walls, or more than two rooms, are also left out. Owning a two-wheeler, fishing boat, fridge or landline no longer excludes a family."
how_to_apply: Ask the gram panchayat or block development office whether your family is on the PMAY-G Permanent Wait List, or check your eligibility and status on the PMAY-G portal. The Awaas+ 2024 survey has closed, so new names are added only through the block office.
apply_url: https://pmayg.dord.gov.in
source_url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2080091
verified_on: 2026-11-20
