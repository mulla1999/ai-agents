id: pm-mudra
name: Pradhan Mantri MUDRA Yojana (PMMY)
level: central
applies_to: household
ministry: Department of Financial Services, Ministry of Finance
tags: [loan, business, self-employed, msme]
summary: Collateral-free bank loans of up to Rs 20 lakh for starting or growing a small non-farm business in manufacturing, trading, services or activities allied to agriculture.
benefits: "Collateral-free loans in four categories: Shishu up to Rs 50,000; Kishor above Rs 50,000 and up to Rs 5 lakh; Tarun above Rs 5 lakh and up to Rs 10 lakh; Tarun Plus above Rs 10 lakh and up to Rs 20 lakh (only for borrowers who have repaid an earlier Tarun loan). Loans can be for working capital (including a MUDRA card), machinery and equipment, or commercial vehicles such as auto-rickshaws and e-rickshaws."
eligibility:
  - any:
      - field: plans_new_business
        op: eq
        value: true
        reason: Wants to start a new small business
      - field: occupation
        op: in
        value: [self_employed, street_vendor, artisan, fisher]
        reason: Already runs a small business, trade, craft or fishery activity
    reason: For people starting or running a small non-farm business
documents:
  - Identity and address proof, and business details or quotations, as asked for by the lending bank or institution
notes:
  - Only for non-corporate, non-farm micro and small enterprises. Crop farming itself is not covered, but activities allied to agriculture such as dairy, poultry, fishery, beekeeping and food processing are.
  - Tarun Plus (above Rs 10 lakh up to Rs 20 lakh) is not for first-time borrowers; it is only for those who have fully repaid an earlier Tarun loan.
  - Interest rate and repayment period are set by the lender within RBI rules.
  - Loans are given by banks, regional rural banks, small finance banks, NBFCs and microfinance institutions. The Union Cabinet has approved continuing the Credit Guarantee Fund for Micro Units, which guarantees these loans, until March 2031.
how_to_apply: Apply at any bank, regional rural bank, small finance bank, NBFC or microfinance institution branch, or online on the JanSamarth portal (MUDRA loans for business activity).
apply_url: https://www.jansamarth.in
source_url: https://financialservices.gov.in/pradhan-mantri-mudra-yojana-pmmy
verified_on: 2026-11-23
