id: pm-kisan
name: PM-KISAN (Pradhan Mantri Kisan Samman Nidhi)
level: central
applies_to: household
ministry: Ministry of Agriculture and Farmers Welfare
tags: [farmer, income-support]
summary: Income support paid directly into the bank accounts of farmer families who own cultivable land.
benefits: Rs 6,000 per year, paid in three instalments of Rs 2,000 directly to the bank account.
eligibility:
  - field: owns_cultivable_land
    op: eq
    value: true
    reason: Family must own cultivable land in its own name
  - field: is_income_tax_payer
    op: eq
    value: false
    reason: Families that paid income tax in the last assessment year are excluded
documents:
  - Aadhaar card
  - Land ownership record (khatauni / ROR / patta)
  - Bank account passbook (account seeded with Aadhaar)
  - Mobile number for e-KYC
notes:
  - Land must have been in the family's name on 1 February 2019. Land bought or gifted after that date does not qualify; land inherited on the owner's death does.
  - One benefit per family (husband, wife and minor children).
  - "Not eligible: serving or retired government employees (except Group D / Class IV / Multi Tasking Staff), pensioners getting Rs 10,000 a month or more, institutional landholders, current or former ministers, MPs, MLAs and other constitutional post holders, and practising doctors, engineers, lawyers, chartered accountants and architects."
  - Some states now also require a Farmer ID (Agri Stack) for new registrations; check with the local agriculture office.
how_to_apply: Register on the PM-KISAN portal under "New Farmer Registration", or visit a Common Service Centre (CSC) or the village revenue officer. Complete Aadhaar e-KYC after registering.
apply_url: https://pmkisan.gov.in
source_url: https://pmkisan.gov.in/Documents/RevisedPM-KISANOperationalGuidelines(English).pdf
verified_on: null
