[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saathi"
version = "0.1.0"
description = "Helps people in India find and apply for government welfare schemes in their own language."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agents-core",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "authlib>=1.3",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
azure = ["agents-core[azure]"]
gemini = ["agents-core[gemini]"]
openai = ["agents-core[openai]"]
all = ["agents-core[all]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "aiosqlite>=0.20"]

[project.scripts]
saathi = "saathi.cli:main"

[tool.uv.sources]
agents-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/saathi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
