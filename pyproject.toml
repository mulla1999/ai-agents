# Workspace root. Not a package itself: every agent and shared library has its own pyproject.toml.

[tool.uv.workspace]
members = ["libs/*", "apps/*/backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["libs", "apps"]
norecursedirs = ["node_modules", "dist", ".venv", "migrations", "data", "artifacts"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["**/migrations/versions"]
