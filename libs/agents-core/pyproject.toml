[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-core"
version = "0.1.0"
description = "Shared building blocks for the agents in this workspace: switchable LLM providers, privacy helpers and messaging channels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "fastapi>=0.111",
]

[project.optional-dependencies]
azure = ["openai>=1.40", "azure-identity>=1.17", "aiohttp>=3.9"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
all = ["agents-core[azure,gemini,openai]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/agents_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
